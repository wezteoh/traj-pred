# Minimal, fast debug run on CPU
wandb:
  project: relativetransformer-nfl
  name: mamba-mog-4blocks-lr2e-3-entropy-1e-3std
train:
  seed: 0
  validate_at_start: true
  test: false
  ckpt: null
  results_dir: ~/ckpt
  monitor_metric: jade_min

# Lightning Trainer
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: 450
  fast_dev_run: false           # one batch train/val/test and exit
  limit_train_batches: null       # safety; only a couple batches
  limit_val_batches: null
  limit_test_batches: null
  log_every_n_steps: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  check_val_every_n_epoch: 5
  
interface:
  name: AutoregressiveMultiplePathPredictionInterface
  diff_as_target: true
  diff_in_input: true
  data_mean: [60.0, 26.5]
  data_std: [30.0, 13.25] # we get the data to the range of -2.0 to 2.0
  diff_mean: [0.0, 0.0]
  diff_std: [1.0, 1.0]
  # diff_std: [21.0, 6.0] # we get the data to the range of -2.0 to 2.0
  game: football
  validation_prefix_length: 30
  validation_max_length: 20
  validation_num_paths: 8
  num_id_to_upload: 3
  num_paths_to_upload: 3
  upload_every_n_epochs: 15
  masking_ratio_start: 0.00
  masking_ratio_end: 0.00
  masking_end_at_training_pct: 0.1
  entropy_weight: 0.05
  min_std: 0.001

dataset:
  name: TrajectoryDataModule
  train_bsz: 128
  val_bsz: 384
  train_size: null
  val_size: 2560
  num_workers: 0
  data_dir: ~/data/traj/nfl

# Small model for speed (used by CPU class after the code tweak below)
model:
  name: MambaRelativeTransformer
  args:
    num_relative_transformer_blocks: 4
    relative_transformer_block_config:
      d_model: 128
      d_mesh: 260
      n_head: 8
      d_ff: 256
      dropout: 0.1
      use_pffn: true
      ln_before_ffn: true
    motion_transformer_encoder_config:
      d_traj: 4
      mamba_mixer_encoder_config:
        n_layer: 3
        d_model: 64
        d_intermediate: 0
        ssm_cfg:
          layer: Mamba2
          d_state: 128
          d_conv: 4
          expand: 4
          headdim: 16
          ngroups: 1
          chunk_size: 64
          bias: False
          conv_bias: False
        rms_norm: True
        fused_add_norm: True
        residual_in_fp32: True
      entity_embedding_dim: 64
      d_model: 128
      use_pre_norm: true
      num_attn_layers: 4
      num_attn_heads: 8
      team_size: 11
    d_agentwise_mlp: [48]
    d_shared_head_mlp: 896
    num_scenes: 8
    num_agents: 23
    traj_conditioning: true
    d_traj: 4
    dropout: 0.0
    use_post_norm: false

# Optimizer
optimizer:
  lr: 0.002
  weight_decay: 0.01
  lr_schedule:
    div_factor: 15
    final_div_factor: 200
    pct_start: 0.06
    total_steps: null
