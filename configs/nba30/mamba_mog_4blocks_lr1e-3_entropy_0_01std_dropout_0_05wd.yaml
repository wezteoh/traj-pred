# Minimal, fast debug run on CPU
wandb:
  project: relativetransformer-nba30
  name: mamba-mog-4blocks-lr1e-3-entropy-0.01std-dropout-0.05wd
train:
  seed: 0
  validate_at_start: true
  test: false
  ckpt: null
  results_dir: ~/ckpt
  monitor_metric: jade_min

# Lightning Trainer
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: 200
  fast_dev_run: false           # one batch train/val/test and exit
  limit_train_batches: null       # safety; only a couple batches
  limit_val_batches: null
  limit_test_batches: null
  log_every_n_steps: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  check_val_every_n_epoch: 5
  
interface:
  name: AutoregressiveMultiplePathPredictionInterface
  diff_as_target: true
  diff_in_input: true
  data_mean: [45.0, 25.0]
  data_std: [22.5, 12.5] # we get the data to the range of -2.0 to 2.0
  diff_mean: [0.0, 0.0]
  diff_std: [0.75, 0.75]
  game: basketball
  validation_prefix_length: 10
  validation_max_length: 20
  validation_num_paths: 8
  num_id_to_upload: 3
  num_paths_to_upload: 3
  video_dir: ~/samples/nba50
  upload_every_n_epochs: 15
  masking_ratio_start: 0.00
  masking_ratio_end: 0.00
  masking_end_at_training_pct: 0.1
  entropy_weight: 0.05
  min_std: 0.01

dataset:
  name: TrajectoryDataModule
  train_bsz: 192
  val_bsz: 1024
  train_size: null
  val_size: 5120
  num_workers: 0
  data_dir: ~/data/traj/nba

# Small model for speed (used by CPU class after the code tweak below)
model:
  name: MambaRelativeTransformer
  args:
    num_relative_transformer_blocks: 4
    relative_transformer_block_config:
      d_model: 128
      d_mesh: 260
      n_head: 8
      d_ff: 256
      dropout: 0.1
      use_pffn: true
      ln_before_ffn: true
    motion_transformer_encoder_config:
      d_traj: 4
      mamba_mixer_encoder_config:
        n_layer: 3
        d_model: 64
        d_intermediate: 0
        ssm_cfg:
          layer: Mamba2
          d_state: 128
          d_conv: 4
          expand: 4
          headdim: 16
          ngroups: 1
          chunk_size: 32 # power of 2
          bias: False
          conv_bias: False
        rms_norm: True
        fused_add_norm: True
        residual_in_fp32: True
      entity_embedding_dim: 64
      d_model: 128
      use_pre_norm: true
      num_attn_layers: 4
      num_attn_heads: 8
      team_size: 5
    d_agentwise_mlp: [64]
    d_shared_head_mlp: 768
    num_scenes: 8
    num_agents: 11
    traj_conditioning: true
    d_traj: 4
    dropout: 0.1
    use_post_norm: false

# Optimizer
optimizer:
  lr: 0.001
  weight_decay: 0.05
  lr_schedule:
    div_factor: 15
    final_div_factor: 200
    pct_start: 0.06
    total_steps: null
