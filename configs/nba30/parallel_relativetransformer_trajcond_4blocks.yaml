# Minimal, fast debug run on CPU
wandb:
  project: parallel-relativetransformer-nba30
  name: diff-input-trajcond-4blocks
train:
  seed: 0
  validate_at_start: true
  test: false
  ckpt: null
  results_dir: ~/ckpt
  monitor_metric: ade_min

# Lightning Trainer
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: 150
  fast_dev_run: false           # one batch train/val/test and exit
  limit_train_batches: null       # safety; only a couple batches
  limit_val_batches: null
  limit_test_batches: null
  log_every_n_steps: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  
interface:
  name: MultiplePathPredictionInterface
  deviation_as_target: true
  diff_in_input: true
  data_mean: [45.0, 25.0]
  data_std: [22.5, 12.5] # we get the data to the range of -2.0 to 2.0
  diff_mean: [0.0, 0.0]
  diff_std: [0.75, 0.75]
  loss_weights:
    reg: 1.0
    agent_path: 1.0
  game: basketball
  prefix_length: 10
  validation_prefix_length: 10
  num_id_to_upload: 3
  num_paths_to_upload: 2
  upload_every_n_epochs: 5
  masking_ratio_start: 0.00
  masking_ratio_end: 0.00
  masking_end_at_training_pct: 0.1
  output_length: 20

dataset:
  name: TrajectoryDataModule
  train_bsz: 192
  val_bsz: 1024
  train_size: null
  val_size: 5120
  num_workers: 0
  data_dir: ~/data/traj/nba

# Small model for speed (used by CPU class after the code tweak below)
model:
  name: ParallelRelativeTransformer
  args:
    num_relative_transformer_blocks: 4
    relative_transformer_block_config:
      d_model: 256
      d_mesh: 516
      n_head: 8
      d_ff: 512
    motion_transformer_encoder_config:
      pointnet_in_channels: 4
      pointnet_hidden_dim: 64
      pointnet_num_layers: 3
      pointnet_num_pre_layers: 1
      pointnet_out_channels: 64
      entity_embedding_dim: 64
      d_model: 256
      use_pre_norm: true
      num_attn_layers: 3
      num_attn_heads: 16
    d_agentwise_compressor_mlp: 32
    d_reg_head_mlp: 512
    d_cls_head_mlp: 128
    num_paths: 20
    num_output_steps: 20
    num_agents: 11
    traj_conditioning: true
    d_traj: 4

# Optimizer
optimizer:
  lr: 0.0005
  weight_decay: 0.01
  lr_schedule:
    div_factor: 15
    final_div_factor: 200
    pct_start: 0.1
    total_steps: null
